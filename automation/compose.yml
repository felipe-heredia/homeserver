name: home-server-automation

volumes:
  readeck-data:

services:
  readeck:
    image: codeberg.org/readeck/readeck:latest
    container_name: readeck
    ports:
      - 8000:8000
    environment:
      READECK_LOG_LEVEL: info
      READECK_SERVER_HOST: "0.0.0.0"
      READECK_SERVER_PORT: 8000
      READECK_LOG_FORMAT: text
    volumes:
      - readeck-data:/readeck
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/readeck", "healthcheck", "-config", "config.toml"]
      interval: 30s
      timeout: 2s
      retries: 3

  sonarr:
    image: ghcr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - /srv/docker/automation/config/sonarr:/config
      - /srv/media:/data
    ports:
      - "8989:8989"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  prowlarr:
    image: ghcr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - /srv/docker/automation/config/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cross-seed:
    image: ghcr.io/cross-seed/cross-seed:latest
    container_name: cross-seed
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - /srv/docker/automation/config/cross-seed:/config
      - /srv/media:/data
    ports:
      - "2468:2468"
    command: daemon
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
