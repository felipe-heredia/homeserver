name: home-server-infra

services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    env_file: /srv/docker/infra/config/pihole/.env # coloque /srv/docker/infra/config/pihole/.env
    environment:
      - TZ=America/Sao_Paulo
      - FTLCONF_dns_listeningMode=all
    volumes:
      - /srv/docker/infra/config/pihole:/etc/pihole
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    cap_add:
      - NET_ADMIN
      - SYS_TIME
    restart: unless-stopped
    networks:
      - infra

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./config/caddy:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - infra
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  infra:

volumes:
  caddy_data:
  caddy_config:
